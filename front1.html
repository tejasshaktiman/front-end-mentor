<!DOCTYPE html>
<html>
    <head>
        
        <style>
            body{
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: rgb(213, 225, 239);
            }
            .card{
                display: flex;
                flex-direction: column;
                border: 1px solid rgb(252, 250, 250);
                width: 240px;
                gap: 10px;
                margin: 100px;
                padding: 15px;
                background-color: white;
                border-radius: 10px;

            }
            .bold1{
                font-family: "Outfit", sans-serif;
                font-optical-sizing: auto;
                font-weight: 600;
                font-style: normal;
                text-align: center;
            }
            .not-bold{
                text-align: center;
                font-size: 15px;
                color: rgb(123, 135, 157);

            }
            .img1{
                border-radius: 10px;
                font-weight: 400;
            }

        </style>
    </head>
    <body>
        <div class="card">
        <img class="img1" src="image-qr-code.png">
        <span class="bold1">Improve your front-end skills by building projects</span>
        <span class="not-bold">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</span>
        </div>
    </body>
</html>
